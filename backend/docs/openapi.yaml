openapi: 3.0.3
info:
  title: CrewHive Shared API
  version: 2.0.0
  description: Canonical API for the website and the mobile app. Envelope { success, data, message } / { success:false, error:{code,message,details} }.
servers:
  - url: http://localhost:4000
components:
  securitySchemes:
    firebaseIdToken: { type: http, scheme: bearer, bearerFormat: Firebase ID token }
  schemas:
    Success: { type: object, properties: { success: { type: boolean, example: true }, data: { type: object }, message: { type: string } } }
    Error: { type: object, properties: { success: { type: boolean, example: false }, error: { type: object, properties: { code: { type: string }, message: { type: string }, details: { type: object } } } } }
paths:
  /api/v1/auth/otp/send:
    post:
      summary: "—; per-IP/device/phone limits; body `sendOtp`"
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/auth/send-otp:
    post:
      summary: "—; alias of /auth/otp/send"
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/auth/otp/verify:
    post:
      summary: "—; body `verifyOtp`; returns customToken+idToken+refreshToken"
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/auth/verify-otp:
    post:
      summary: "—; alias"
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/auth/refresh:
    post:
      summary: "—; body `refresh`"
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/auth/logout:
    post:
      summary: "—; revokes refresh tokens"
      security: [ { firebaseIdToken: [] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/auth/me:
    get:
      summary: "—; role/approved/exists"
